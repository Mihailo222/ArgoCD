apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: prom-grafana-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mihailo222/ArgoCD.git
    targetRevision: HEAD
    path: helm_charts/prometheus-grafana
  destination: 
    server: https://kubernetes.default.svc
    namespace: prometheus-grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true
