apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: ingress-nginx-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mihailo222/ArgoCD.git
    targetRevision: HEAD
    path: helm_charts/nginx_ingress_controller
  destination: 
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true
